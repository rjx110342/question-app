<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>我的静态网站</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 50px; }
  </style>
</head>
<body>
  <h1>Hello from Static File</h1>
  <p>这个页面来自 public/index.html</p>

  <script>
    // 延迟执行 JavaScript，确保用户先看到页面内容
    setTimeout(function() {
      alert("这是第一个 JavaScript 例子!");
      alert("欢迎你进入 JavaScript 世界!");
      alert("今后我们将共同学习 JavaScript 知识！");
    }, 100); // 100 毫秒足够短，又能保证内容已绘制
  </script>
</body>
</html>
